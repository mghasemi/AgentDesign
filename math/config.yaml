model:
  default: qwen3.8-27b
  provider: lmstudio
  base_url: http://localhost:1234/v1
providers:
  lmstudio:
    base_url: http://localhost:1234/v1
    models:
      qwen3.8-27b:
        stale_timeout_seconds: 900
fallback_providers:
  - provider: lmstudio
    model: qwen3.8-27b
agent:
  service_tier: auto
  reasoning_overrides:
    qwen3.8-27b: medium
  reasoning_effort: medium
terminal:
  cwd: /home/YOUR-USER/Code/Python/
browser:
  allow_private_urls: true
  cloud_provider: browser-use
auxiliary:
  compression:
    provider: nous
    model: poolside/laguna-s-2.1:free
  title_generation:
    provider: lmstudio
    model: qwen3-8b
  profile_describer:
    provider: lmstudio
    model: qwen3-8b
display:
  pet:
    enabled: false
    slug: pixel-panda
dashboard:
  basic_auth:
    username: YOUR-USER
    password_hash: REPLACE_ME
    secret: REPLACE_ME
tts:
  provider: openai
stt:
  enabled: false
voice:
  auto_tts: false
context:
  engine: compressor
memory:
  provider: honcho
delegation:
  reasoning_effort: high
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: moonshotai/kimi-k2.6
          enabled: true
        - provider: openrouter
          model: z-ai/glm-5.3
          enabled: true
      aggregator:
        provider: openrouter
        model: deepseek/deepseek-v4-pro
      degraded_reference_policy: loud
      fanout: per_iteration
  reference_models:
    - provider: openrouter
      model: moonshotai/kimi-k2.6
      enabled: true
    - provider: openrouter
      model: z-ai/glm-5.3
      enabled: true
  aggregator:
    provider: openrouter
    model: deepseek/deepseek-v4-pro
  max_tokens: REPLACE_ME
  fanout: per_iteration
  enabled: true
  degraded_reference_policy: loud
skills:
  disabled:
    - calibre
    - docx
    - dogfood
    - github-auth
    - llama-cpp
    - merge-reconciler
    - node-inspect-debugger
    - opencode
    - powerpoint
    - rss-feeds
    - test-driven-development
    - reddit-reading
approvals:
  mode: 'off'
  timeout: 600
command_allowlist:
  - script execution via -e/-c flag
plugins:
  enabled:
    - vikunja
    - wiki-browser
  disabled:
    - hermes-android
    - spotify
  entries:
    hermes-android:
      allow_tool_override: false
    wiki-browser:
      allow_tool_override: false
hooks:
  on_session_start:
    - command: ~/.hermes/agent-hooks/ensure-lmstudio.sh
security:
  allow_private_urls: true
kanban:
  orchestrator_profile: math
  default_assignee: math
code_execution:
  mode: project
sessions:
  auto_archive: true
desktop:
  repo_scan_roots:
    - /home/YOUR-USER/Code/Python/
_config_version: 49
mcp_servers:
  vikunja:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      VIKUNJA_URL: http://YOUR-HOST:3456
      VIKUNJA_ALT_URL: http://YOUR-DDNS-HOST:3456
      VIKUNJA_TOKEN: REPLACE_ME
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/productivity/vikunja/vikunja_tool.py
      TOOL_SERVER_NAME: vikunja
    timeout: 30
  wolfram-alpha:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      WOLFRAM_ALPHA_APPID: REPLACE_ME
      WOLFRAM_ALPHA_TIMEOUT: '20'
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/research/wolfram-alpha/wolfram_alpha_tool.py
      TOOL_SERVER_NAME: wolfram-alpha
    timeout: 30
  lightrag-query:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      LIGHTRAG_URL: http://YOUR-HOST:9621
      LIGHTRAG_ALT_URL: http://YOUR-DDNS-HOST:9621
      LIGHTRAG_TIMEOUT: '20'
      LIGHTRAG_API_KEY: REPLACE_ME
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/research/lightrag/lightrag_query_tool.py
      TOOL_SERVER_NAME: lightrag-query
    timeout: 30
  siyuan:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      SIYUAN_URL: http://YOUR-HOST:6806
      SIYUAN_TOKEN: REPLACE_ME
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/productivity/siyuan/siyuan_tool.py
      TOOL_SERVER_NAME: siyuan
    timeout: 30
  zimi:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      ZIMI_URL: http://YOUR-HOST:8899
      ZIMI_ALT_URL: http://YOUR-DDNS-HOST:8899
      ZIMI_TIMEOUT: '20'
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/research/zimi/zimi_tool.py
      TOOL_SERVER_NAME: zimi
    timeout: 30
  searxng:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/skills/research/searxng/scripts/searxng_mcp_server.py
    env:
      SEARXNG_URL: http://YOUR-HOST:5050
    timeout: 30
  zotero:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      ZOTERO_LIBRARY_TYPE: user
      ZOTERO_LIBRARY_ID: REPLACE_ME
      ZOTERO_API_KEY: REPLACE_ME
      ZOTERO_BIB_PATH: ''
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/productivity/zotero/zotero_tool.py
      TOOL_SERVER_NAME: zotero
    timeout: 30
  scientific-coding:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      SANDBOX_CPU_SECONDS: '30'
      SANDBOX_MEM_MB: '512'
      SIYUAN_URL: http://YOUR-HOST:6806
      SIYUAN_TOKEN: REPLACE_ME
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/research/scientific-coding/scientific_coding_tool.py
      TOOL_SERVER_NAME: scientific-coding
    timeout: 60
  lean4:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/skills/research/lean4/lean4_mcp_server.py
    env:
      HOME: /home/YOUR-USER
      PATH: /home/YOUR-USER/.elan/bin:/usr/bin
    timeout: 30
  sagemath:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/skills/research/sagemath-mcp/sagemath_mcp_server.py
    env:
      SAGE_TIMEOUT: '120'
      PATH: /home/YOUR-USER/miniconda3/envs/sage/bin:/home/YOUR-USER/.elan/bin:/usr/bin
    timeout: 30
  latex-manuscript:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/.hermes/profiles/math/scripts/mcp_cli_adapter.py
    env:
      LATEX_COMPILER: pdflatex
      LATEX_GLOSSARY_GROUP: math-notation-glossary
      TOOL_SCRIPT: /home/YOUR-USER/.hermes/profiles/math/skills/productivity/latex-manuscript/latex_tool.py
      TOOL_SERVER_NAME: latex-manuscript
    timeout: 30
  hermes-irene:
    command: /home/YOUR-USER/.hermes/mcp-servers/.venv/bin/python
    args:
      - /home/YOUR-USER/Code/Python/IreneRewrite/scripts/hermes_mcp_tool.py
    env:
      LIGHTRAG_URL: http://YOUR-HOST:9621
      LIGHTRAG_ALT_URL: http://YOUR-DDNS-HOST:9621
      LIGHTRAG_TIMEOUT: '30'
      IRENE_SOURCE_DIR: /home/YOUR-USER/Code/Python/IreneRewrite/Irene
    enabled: false
  calibre:
    env:
      CALIBRE_LIBRARY_PATH: /home/YOUR-USER/mnt/calibre
platforms:
  telegram:
    enabled: true
  webhook:
    enabled: false
  whatsapp:
    enabled: false
image_gen:
  use_gateway: true
platform_toolsets:
