# =============================================================================
# AgentDesign stack — the self-hosted service plane of the math / librarian
# Hermes profiles, as one docker-compose project.
#
# Reconstructed from the live host (mehdi-m5plus), where these services
# currently run as seven separate compose projects under /opt/docker/:
#     docker       -> npm, portainer, siyuan, searxng, searxng-redis
#     honcho       -> honcho-api, honcho-deriver, honcho-database, honcho-redis
#     lightrag     -> lightrag, neo4j, qdrant
#     vikunja      -> vikunja
#     zimi         -> zimi
#     pocketbase   -> pocketbase-inbox
#     paperflow    -> paperflow
# This file unifies all sixteen containers into a single stack.
#
# Nothing secret is stored here: every credential is interpolated from .env
# (see .env.example). Ports, images and volume layout mirror the live host.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# NOT part of this stack (host-level or external — see README.md):
#   - LM Studio inference server, reachable at the address in LM_STUDIO_BASE_URL
#   - calibre-server on the host (:9876), managed as a systemd service
#   - SaaS APIs: Zotero, Wolfram|Alpha, Semantic Scholar, arXiv, Crossref
# =============================================================================

name: agentdesign-stack

networks:
  proxynet:
    name: proxynet

volumes:
  honcho-pgdata:
  honcho-redis-data:

services:

  # ---------------------------------------------------------------------------
  # Edge: reverse proxy and container management
  # ---------------------------------------------------------------------------
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - ${STACK_DATA_DIR:-./data}/npm/data:/data
      - ${STACK_DATA_DIR:-./data}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxynet

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_DATA_DIR:-./data}/portainer/data:/data
    networks:
      - proxynet

  # ---------------------------------------------------------------------------
  # Knowledge management: notes, task ledger
  # ---------------------------------------------------------------------------
  siyuan:
    image: b3log/siyuan:latest
    container_name: siyuan
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${SIYUAN_PORT:-6806}:6806"
    volumes:
      - ${STACK_DATA_DIR:-./data}/siyuan:/siyuan/workspace
    command: serve --workspace=/siyuan/workspace/ --accessAuthCode=${SIYUAN_ACCESS_AUTH_CODE}
    networks:
      - proxynet

  vikunja:
    image: vikunja/vikunja:2.3.0
    container_name: vikunja-vikunja-1
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_MAILER_ENABLED: "${VIKUNJA_MAILER_ENABLED:-false}"
      VIKUNJA_MAILER_HOST: ${VIKUNJA_MAILER_HOST:-}
      VIKUNJA_MAILER_PORT: "${VIKUNJA_MAILER_PORT:-465}"
      VIKUNJA_MAILER_USERNAME: ${VIKUNJA_MAILER_USERNAME:-}
      VIKUNJA_MAILER_PASSWORD: ${VIKUNJA_MAILER_PASSWORD:-}
      VIKUNJA_MAILER_FROMEMAIL: ${VIKUNJA_MAILER_FROMEMAIL:-}
    ports:
      - "${VIKUNJA_PORT:-3456}:3456"
    volumes:
      - ${STACK_DATA_DIR:-./data}/vikunja/files:/app/vikunja/files
      - ${STACK_DATA_DIR:-./data}/vikunja/db:/db
    networks:
      - proxynet

  # ---------------------------------------------------------------------------
  # Retrieval: federated search, offline archives, graph-RAG
  # ---------------------------------------------------------------------------
  searxng-redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${STACK_DATA_DIR:-./data}/searxng/redis:/data
    networks:
      - proxynet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    depends_on:
      - searxng-redis
    ports:
      - "${SEARXNG_PORT:-5050}:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    networks:
      - proxynet

  zimi:
    image: epheterson/zimi
    container_name: zimi
    restart: unless-stopped
    ports:
      - "${ZIMI_PORT:-8899}:8899"
    volumes:
      - ${STACK_DATA_DIR:-./data}/zimi/zims:/zims
    environment:
      ZIMI_MANAGE_PASSWORD: ${ZIMI_MANAGE_PASSWORD}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - proxynet

  lightrag:
    # The live host runs a local build of the upstream LightRAG repository; the
    # published image is the portable equivalent. To reproduce the local build,
    # replace `image:` with:
    #   build:
    #     context: ./lightrag/LightRAG
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    user: "${UID:-1000}:${GID:-1000}"
    restart: on-failure
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ${STACK_DATA_DIR:-./data}/lightrag/rag_storage:/app/data/rag_storage
      - ${STACK_DATA_DIR:-./data}/lightrag/inputs:/app/data/inputs
      - ./lightrag/.env:/app/.env
      - ${STACK_DATA_DIR:-./data}/lightrag/lightrag.log:/app/lightrag.log
    environment:
      - WORKING_DIR=/app/data/rag_storage
      - INPUT_DIR=/app/data/inputs
      - HOST=0.0.0.0
      - PORT=9621
    networks:
      - proxynet

  neo4j:
    image: neo4j:5.20.0
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ${STACK_DATA_DIR:-./data}/lightrag/neo4j/data:/data
      - ${STACK_DATA_DIR:-./data}/lightrag/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - proxynet

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${STACK_DATA_DIR:-./data}/lightrag/qdrant_data:/qdrant/storage
    networks:
      - proxynet

  # ---------------------------------------------------------------------------
  # Ingestion: paper conversion, wiki intake queue
  # ---------------------------------------------------------------------------
  paperflow:
    build:
      context: ./paperflow
    container_name: paperflow
    restart: unless-stopped
    ports:
      - "${PAPERFLOW_PORT:-8000}:8000"
    environment:
      - DATA_DIR=/data/jobs
      - MAX_PAGES=${PAPERFLOW_MAX_PAGES:-600}
      - MAX_FILE_SIZE_MB=${PAPERFLOW_MAX_FILE_SIZE_MB:-100}
      - MAX_FILE_SIZE=${PAPERFLOW_MAX_FILE_SIZE_MB:-100}
      - PADDLEOCR_VL_CMD=paddleocr
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    volumes:
      - ${STACK_DATA_DIR:-./data}/paperflow:/data
    networks:
      - proxynet

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase-inbox
    restart: unless-stopped
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - ${STACK_DATA_DIR:-./data}/pocketbase/pb_data:/pb_data
      - ${STACK_DATA_DIR:-./data}/pocketbase/pb_public:/pb_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxynet

  # ---------------------------------------------------------------------------
  # Persistent research memory (Honcho): API, deriver worker, pgvector, redis
  # Requires the upstream Honcho source tree at ./honcho (see README.md).
  # ---------------------------------------------------------------------------
  honcho-api:
    build:
      context: ./honcho
      dockerfile: Dockerfile
    container_name: honcho-api-1
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    ports:
      - "${HONCHO_PORT:-8008}:8000"
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@honcho-database:5432/${POSTGRES_DB:-postgres}
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: ./honcho/.env
        required: false
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxynet

  honcho-deriver:
    build:
      context: ./honcho
      dockerfile: Dockerfile
    container_name: honcho-deriver-1
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@honcho-database:5432/${POSTGRES_DB:-postgres}
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: ./honcho/.env
        required: false
    networks:
      - proxynet

  honcho-database:
    image: pgvector/pgvector:pg15
    container_name: honcho-database-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HONCHO_DB_PORT:-5433}:5432"
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - honcho-pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxynet

  honcho-redis:
    image: redis:8.2
    container_name: honcho-redis-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HONCHO_REDIS_PORT:-6379}:6379"
    volumes:
      - honcho-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxynet